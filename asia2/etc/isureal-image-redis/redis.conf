# asia2: read-only SSH observation confirmed 192.168.4.10 on ens5.
# Authentication is generated by the coordinated deployment, outside Git.
bind 127.0.0.1 192.168.4.10
protected-mode yes
port 6380
daemonize no
logfile ""
dir /var/lib/isureal-image-redis

# Coordination gates must survive an acknowledged write and must never expire
# or be evicted. Cache entries are individually limited to <=60 seconds.
appendonly yes
appendfsync always
no-appendfsync-on-rewrite no
aof-load-truncated no
save ""
maxmemory 512mb
maxmemory-policy noeviction

include /etc/isureal-image-redis/auth.conf
