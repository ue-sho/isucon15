# 3.7GiB RAM、PostgreSQLとpproteinが同居する共有DBのみ。
# shared_buffersの変更はPostgreSQL再起動が必要。
shared_buffers = '512MB'
# メモリ割当ではなく、DBとOSの利用可能キャッシュを見積もるplanner用の値。
effective_cache_size = '2GB'
# WAL量によるcheckpointの頻発を抑える比較候補。reloadで反映可能。
# WALの保持量と障害復旧時間が増える可能性がある。厳密な容量上限ではない。
max_wal_size = '2GB'
# work_mem・接続上限・checkpoint間隔は既存値を維持する。
# fsync/synchronous_commit/full_page_writesは変更せず、保存・再起動条件を維持する。
