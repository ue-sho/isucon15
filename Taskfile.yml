version: '3'

tasks:
  deploy:
    desc: 手元の現在ブランチ（BRANCH=xxx で指定可）を3台すべてにデプロイ
    cmds:
      - bash isutools/scripts/deploy.sh {{.BRANCH}}

  status:
    desc: 3台の反映状態（ブランチ / commit / 最終デプロイ者 / サービス / ロック）
    cmds:
      - bash isutools/scripts/status.sh

  unlock:
    desc: 残ってしまったデプロイロックを解除（-- -y で確認省略）
    cmds:
      - bash isutools/scripts/unlock.sh {{.CLI_ARGS}}

  log-off:
    desc: 計測をすべて止める設定をコミット（反映は push → task deploy）
    cmds:
      - bash isutools/scripts/logmode.sh off

  log-on:
    desc: 計測を再開する設定をコミット（反映は push → task deploy）
    cmds:
      - bash isutools/scripts/logmode.sh on

  test:
    desc: isutools のテストと lint（開発者向け）
    cmds:
      - bats isutools/tests
      - find isutools -name '*.sh' -not -path '*/node_modules/*' -print0 | xargs -0 shellcheck -x isutools/tests/helpers/fake-ssh isutools/tests/helpers/stubs/_stub
