version: '3'

silent: true

tasks:
  deploy:
    desc: 指定コミットをアプリサーバーへ反映し、ビルド・再起動コマンドを実行
    requires:
      vars: [APP_HOST, APP_DIR, REV, DEPLOY_COMMAND]
    cmds:
      - >-
        ssh {{.APP_HOST | shellQuote}}
        {{printf "set -eu; cd %s; git fetch origin %s; git checkout --detach FETCH_HEAD; %s" (.APP_DIR | shellQuote) (.REV | shellQuote) .DEPLOY_COMMAND | shellQuote}}

  bench:
    desc: ポータルAPIでベンチを1回起動し、完了後の結果を出力
    requires:
      vars: [PORTAL_TARGET_ID, PORTAL_COOKIE, PORTAL_CSRF_TOKEN]
    cmds:
      - python3 scripts/portal_bench.py
