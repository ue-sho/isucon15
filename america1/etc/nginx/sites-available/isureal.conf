server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # 外部から直接アクセスさせず、アプリの検証後だけファイルを配信する。
  location ^~ /_isureal_images/ {
    internal;
    alias /var/cache/isureal/images/;
    types { image/jpeg jpg; image/png png; }
    default_type application/octet-stream;
    sendfile on;
    gzip off;
    autoindex off;
    disable_symlinks on;
    etag off;
    if_modified_since off;
    max_ranges 0;
    add_header Cache-Control "no-store" always;
  }

  location = /api/feeds/friends {
    include /etc/nginx/snippets/isureal-regional-api.conf;
  }
  location = /api/posting-window/current {
    include /etc/nginx/snippets/isureal-regional-api.conf;
  }
  location = /api/posts/me/current {
    include /etc/nginx/snippets/isureal-regional-api.conf;
  }

  location = /api/notifications {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    gzip off;
    proxy_pass http://isureal_local_api;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 32k;
    proxy_max_temp_file_size 0;
    proxy_pass http://isureal_local_api;
  }

  location / {
    try_files $uri /index.html;
  }
}
