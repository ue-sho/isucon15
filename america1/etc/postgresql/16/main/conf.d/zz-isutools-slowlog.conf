# PostgreSQL 16: pprotein / slp pg 用の計測設定。
# logging_collector の変更には PostgreSQL の再起動が必要。
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-slow.log'
log_file_mode = 0640

# agent が固定ファイルを追跡するため、自動ローテーションは無効。
# 計測後はログを保全してから容量を管理すること。
log_rotation_age = 0
log_rotation_size = 0
log_truncate_on_rotation = off

# slp pg --log-line-prefix='%m [%p] ' と合わせる。
log_line_prefix = '%m [%p] '
lc_messages = 'C'
log_statement = 'none'
log_duration = off
# 全 SQL の回数・総時間を集計。計測を止める場合は -1 にして reload。
log_min_duration_statement = 0
