# Optional template. Not deployed or enabled by existing automation.
# Bind to the verified asia2 application-facing address as well as loopback,
# keeping the mandated router path. Never bind publicly without authentication.
bind 127.0.0.1
protected-mode yes
port 6379
daemonize no
logfile ""
dir /var/lib/isureal-image-redis

# Coordination gates must survive an acknowledged write and must never expire
# or be evicted. Cache entries are individually limited to <=60 seconds.
appendonly yes
appendfsync always
no-appendfsync-on-rewrite no
aof-load-truncated no
save ""
maxmemory 512mb
maxmemory-policy noeviction

# Configure ACL/password in a separate, protected file before enabling remote
# access. Do not commit its contents or print connection URLs with credentials.
# include /etc/isureal-image-redis/auth.conf
