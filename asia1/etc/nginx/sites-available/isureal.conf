server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # 外部から直接アクセスさせず、アプリの検証後だけファイルを配信する。
  location ^~ /_isureal_images/ {
    internal;
    alias /var/cache/isureal/images/;
    types { image/jpeg jpg; image/png png; }
    default_type application/octet-stream;
    sendfile on;
    gzip off;
    autoindex off;
    disable_symlinks on;
    etag off;
    if_modified_since off;
    max_ranges 0;
    add_header Cache-Control "no-store" always;
  }

  location = /api/notifications {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    gzip off;
    proxy_pass http://isureal_local_api;
  }

  # 履歴の署名生成をasia2へ分離し、asia1の投稿処理とCPUを共有しない。
  location = /api/memories {
    include /etc/nginx/snippets/isureal-memories-api.conf;
  }

  location ~ ^/api/memories/[^/]+$ {
    include /etc/nginx/snippets/isureal-memories-api.conf;
  }

  # PUTだけ受信を逐次転送。DELETEや未対応メソッドの本文処理は従来どおり。
  location = /api/me/profile-image {
    error_page 418 = @isureal_profile_upload;
    if ($request_method = PUT) { return 418; }
    include /etc/nginx/snippets/isureal-profile-upload.conf;
  }

  location @isureal_profile_upload {
    proxy_request_buffering off;
    # 上流へ書込みを再送しない。
    proxy_next_upstream off;
    include /etc/nginx/snippets/isureal-profile-upload.conf;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 32k;
    proxy_max_temp_file_size 0;
    proxy_pass http://isureal_local_api;
  }

  location / {
    try_files $uri /index.html;
  }
}
