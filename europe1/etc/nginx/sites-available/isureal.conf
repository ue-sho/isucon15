server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  location = /api/posts {
    include /etc/nginx/snippets/isureal-regional-api.conf;
  }
  location = /api/feeds/friends {
    include /etc/nginx/snippets/isureal-regional-api.conf;
  }
  location = /api/posting-window/current {
    include /etc/nginx/snippets/isureal-regional-api.conf;
  }
  location = /api/posts/me/current {
    include /etc/nginx/snippets/isureal-regional-api.conf;
  }

  location /api/ {
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:8080;
  }

  location / {
    try_files $uri /index.html;
  }
}
